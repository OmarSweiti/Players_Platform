# The local development stack — `just up` starts it, `infra/README.md` explains it.
#
# - Every image is pinned by digest; the tag beside it is for people. Moving one is
#   a reviewed change, and scripts/check-stack.py refuses a tag without a digest.
# - Every published port binds to 127.0.0.1: nothing here is reachable from another
#   machine. The credentials in infra/.env exist for this machine only.
# - Volumes labelled org.sadara.state hold local state; `just reset` removes exactly
#   those and keeps the proxy's certificate authority and ClamAV's signatures.
name: sadara

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722 # ADR-0013: the digest the backend's CI replays on
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run `just up`, which creates infra/.env}
      POSTGRES_DB: sadara
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql # PostgreSQL 18 images keep PGDATA below it, in 18/docker
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: the entrypoint's temporary server runs the init
      # scripts on a socket only, so this passes once the real server is up.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=sadara"]
      interval: 2s
      timeout: 5s
      retries: 60

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--save", "60", "1"]
    ports: ["127.0.0.1:${VALKEY_PORT:-6379}:6379"]
    volumes: [valkey:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Versity S3 Gateway: private, versioned buckets, presigned URLs, reads pinned
  # to a version — everything the storage port needs (ADR-0009, ADR-0020).
  # infra/objectstore/bootstrap.py creates the buckets and proves it on `just up`.
  objectstore:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    environment:
      ROOT_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:?run `just up`, which creates infra/.env}
      ROOT_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:?run `just up`, which creates infra/.env}
      VGW_PORT: ":7070"
      VGW_HEALTH: /health
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/buckets
      VGW_VERSIONING_DIR: /data/versions # outside the bucket root, or it would list as a bucket
    ports: ["127.0.0.1:${OBJECT_STORE_PORT:-7070}:7070"]
    volumes:
      - objectstore-buckets:/data/buckets
      - objectstore-versions:/data/versions
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:1.5.4-debian@sha256:9bb8712a50f0e75166e936c452cd82dd5e5be0b85586598930b5bbb84a99a578
    environment:
      # One signature database in memory, never two: a concurrent reload doubles
      # clamd's memory for the length of every update.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    ports: ["127.0.0.1:${CLAMAV_PORT:-3310}:3310"]
    volumes: [clamav:/var/lib/clamav] # signatures: kept by `just reset`, refreshed by freshclam
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 5m # the first start loads, or downloads, the signature database

  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes: [mailpit:/data]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Development mode only: start-dev has insecure defaults (HTTP, a file
  # database, relaxed hostname checks) and never leaves this machine (ADR-0002).
  # The sadara realm arrives as code in 0.5.1.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run `just up`, which creates infra/.env}
      KC_HEALTH_ENABLED: "true"
    mem_limit: 1g # the JVM sizes its heap from this, not from the whole Docker machine
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"]
    volumes: [keycloak:/opt/keycloak/data]
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp asks the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 2m

  # One HTTPS origin per tenant host, routed as production routes it: /api/ to
  # the API on this machine's :3000, everything else to the web app on :3001.
  proxy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - "127.0.0.1:${PROXY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${PROXY_HTTP_PORT:-80}:80" # redirects to HTTPS
    extra_hosts: ["host.docker.internal:host-gateway"] # the applications run on this machine
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data # the local certificate authority: kept by `just reset`
      - proxy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
    labels: { org.sadara.state: "true" }
  valkey:
    labels: { org.sadara.state: "true" }
  objectstore-buckets:
    labels: { org.sadara.state: "true" }
  objectstore-versions:
    labels: { org.sadara.state: "true" }
  mailpit:
    labels: { org.sadara.state: "true" }
  keycloak:
    labels: { org.sadara.state: "true" }
  clamav: {}
  proxy-data: {}
  proxy-config: {}
